name: Build and Deploy EZPark API

on:
  push:
    branches: [ part-four, main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Find API project and Publish
        shell: pwsh
        run: |
          $proj = Get-ChildItem -Recurse -Filter *.csproj | Where-Object { $_.Name -notmatch 'DAL|BLL|DTO|Model|Test' } | Select-Object -First 1
          if (-not $proj) { throw "No Web API .csproj file found!" }
          Write-Host "Building project: $($proj.FullName)"
          dotnet restore $proj.FullName
          dotnet build $proj.FullName --configuration Release --no-restore
          dotnet publish $proj.FullName --configuration Release --no-build --output ./publish

      - name: Deploy to MonsterASP
        uses: SamKirkland/web-deploy@v1
        with:
          target-url: ${{ secrets.SERVER_COMPUTER_NAME }}
          website-name: ${{ secrets.WEBSITE_NAME }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source-path: ./publish
