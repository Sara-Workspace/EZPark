name: Build and Deploy EZPark API

on:
  push:
    branches: [ part-four]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore EZPark/EZPark.csproj

      - name: Build
        run: dotnet build EZPark/EZPark.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish EZPark/EZPark.csproj --configuration Release --no-build --output ./publish

      - name: Deploy to MonsterASP
        uses: SamKirkland/web-deploy@v1
        with:
          target-url: ${{ secrets.SERVER_COMPUTER_NAME }}
          website-name: ${{ secrets.WEBSITE_NAME }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source-path: ./publish
